name: Compiler NEBULA-X.apk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: gradle assembleDebug
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Vérifier et renommer l'APK
        run: |
          ls -la app/build/outputs/apk/debug/
          cp app/build/outputs/apk/debug/app-debug.apk NEBULA-X.apk
          unzip -l NEBULA-X.apk | grep -E "classes.dex|AndroidManifest.xml"

      - name: Publier NEBULA-X.apk (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NEBULA X v1.0.${{ github.run_number }}
          body: APK Android (debug signé) pour Samsung Galaxy S24 Ultra.
          files: NEBULA-X.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NEBULA-X-apk
          path: NEBULA-X.apk
